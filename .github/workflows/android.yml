name: Android app

# Builds the Android app and publishes seoul.apk as a release.
# Download link that always points at the newest build:
#   https://github.com/songaal/seoul/releases/latest/download/seoul.apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing password
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing password missing::Add the repository secret KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi
          if ! keytool -list -keystore android/signing/seoul-release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error title=Signing password wrong::The KEYSTORE_PASSWORD secret does not open android/signing/seoul-release.p12."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log

      - name: Report what went wrong
        if: failure()
        working-directory: android
        run: |
          [ -f build.log ] || exit 0
          grep -n -E "What went wrong|error:|ERROR|Could not|FAILED|Execution failed|not found|Unresolved" build.log | head -25 | while IFS= read -r line; do
            echo "::error title=Build::${line}"
          done
          tail -40 build.log

      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk seoul.apk
          ls -la seoul.apk
          gh release create "v$VERSION_NAME" seoul.apk \
            --title "seoul Android $VERSION_NAME" \
            --notes "안드로이드 앱 설치 파일입니다. seoul.apk 를 받아서 설치하세요." \
            --latest
