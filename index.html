<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>seoul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one phone-width column. Top bar, scrolling middle, five-icon bottom menu.
   Feed media runs edge to edge; text keeps a 16px gutter. Every interest owns a hue and
   shows up as a big word tile wherever a post has no photo. */
:root{
  --bg:#ECECF4;
  --surface:#FFFFFF;
  --surface-2:#F4F4FA;
  --ink:#17152E;
  --ink-2:#5D5A76;
  --line:#DAD9E7;
  --accent:#D63A14;
  --accent-ink:#FFFFFF;
  --accent-soft:#FCE5DD;
  --danger:#B3261E;
  --tile-l:58%;
  --tile-c:0.15;
  --tile-ink:#FFFFFF;
  --shadow:0 10px 30px rgba(23,21,46,.14);
  --display:"Gasoek One","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0914; --surface:#141327; --surface-2:#1C1B33; --ink:#EEEDF8; --ink-2:#A3A0BD;
    --line:#2E2C4A; --accent:#FF7A52; --accent-ink:#1D0C05; --accent-soft:#3A1D15; --danger:#FF8A80;
    --tile-l:50%; --tile-c:0.14; --tile-ink:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0914; --surface:#141327; --surface-2:#1C1B33; --ink:#EEEDF8; --ink-2:#A3A0BD;
  --line:#2E2C4A; --accent:#FF7A52; --accent-ink:#1D0C05; --accent-soft:#3A1D15; --danger:#FF8A80;
  --tile-l:50%; --tile-c:0.14; --tile-ink:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}

.shell{height:100%;max-width:460px;margin-inline:auto;background:var(--surface);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:500px){.shell{border-inline:1px solid var(--line)}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 10px;min-height:56px}
.top.deep{padding-inline:6px}
.brand{font-family:var(--display);font-size:24px;line-height:1;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--accent)}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top.deep .ttl{flex:1;text-align:center}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
button.iconbtn:hover,.ib:hover{background:var(--surface-2)}
.link{color:var(--ink-2);font-size:13px;font-weight:500;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.link.sm{font-size:12px;padding:0 4px}
svg.i{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* scrolling middle */
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:4px 28px}
.scroll.form{padding-inline:16px;gap:22px;padding-top:8px}
.scroll > *{flex:none}
.pad{padding-inline:16px}
.h1{font-size:23px;line-height:1.3;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--ink-2);margin-top:6px}
.h3{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.group{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* signup steps */
.steps{list-style:none;margin:0;padding:4px 16px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps button{width:100%;text-align:left;font-size:12px;font-weight:500;color:var(--ink-2);padding:8px 0 2px;border-top:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .done button{border-top-color:var(--ink);color:var(--ink)}
.steps .on button{border-top-color:var(--accent);color:var(--ink);font-weight:700}

.bar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.btn{white-space:nowrap;flex:none;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.ghost:hover,.btn.small:hover{background:var(--surface-2)}
.btn.small{min-height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.wide{width:100%}
.btn.danger{background:var(--danger);color:var(--surface);min-height:40px;border-radius:10px;font-size:14px}

/* avatar */
.av{--s:96px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:oklch(var(--tile-l) var(--tile-c) var(--h,18));color:var(--tile-ink);font-family:var(--display);font-size:calc(var(--s)*.46);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.ring{display:inline-grid;flex:none;border-radius:50%;padding:2px;border:2px solid var(--line)}
.ring.on{border-color:var(--accent)}
.av-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.av-ctl{display:flex;flex-direction:column;gap:10px;min-width:0}
.av-btns{display:flex;gap:8px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:oklch(var(--tile-l) var(--tile-c) var(--h));border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sr-only:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}

/* form fields */
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.input,.textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:13px 14px;font-size:16px}
.input.sm{padding:9px 12px;border-radius:10px;min-width:0}
.textarea{min-height:110px;resize:vertical;line-height:1.5}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.input.bad{border-color:var(--danger)}
.hint{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.hint .msg{min-width:0}
.hint .msg.err{color:var(--danger);font-weight:500}
.hint .cnt{font-variant-numeric:tabular-nums;flex:none}
.count.err{color:var(--danger);font-weight:600}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.rowx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-inline:16px}
.chips.rowx .chip{flex:none}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.static{cursor:default;min-height:24px;padding:0 9px;font-size:11px;font-weight:600;color:var(--ink-2)}
.chip.static:hover{background:var(--surface)}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pick{position:relative;min-height:74px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-weight:600}
.pick .dot{width:18px;height:18px;border-radius:6px;background:oklch(var(--tile-l) var(--tile-c) var(--h))}
.pick:hover{background:var(--surface-2)}
.pick[aria-pressed="true"]{border-color:transparent;background:oklch(var(--tile-l) var(--tile-c) var(--h));color:var(--tile-ink)}
.pick[aria-pressed="true"] .dot{background:var(--tile-ink)}
.pick .ck{position:absolute;top:10px;right:10px;font-size:13px;opacity:0}
.pick[aria-pressed="true"] .ck{opacity:1}

.follow{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .t{min-width:0}
.frow b{display:block;font-size:15px}
.frow small{color:var(--ink-2);font-size:12px}
.fbtn{min-height:34px;min-width:76px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);flex:none}
.fbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.fbtn.wide{width:100%;min-height:36px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* circle strip: accounts on home, interests on a profile */
.strip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 14px}
.strip.line{border-bottom:1px solid var(--line)}
.strip button{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px}
.strip .lbl{width:100%;font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.strip .av{--s:56px}

/* word tiles and post media */
.tile{position:relative;container-type:inline-size;aspect-ratio:1;overflow:hidden;background:oklch(var(--tile-l) var(--tile-c) var(--h));color:var(--tile-ink);max-width:100%;display:block;width:100%}
.tile .word{position:absolute;left:5cqw;bottom:5cqw;font-family:var(--display);font-size:30cqw;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.tile .tag{position:absolute;left:5cqw;top:5cqw;font-size:14px;font-weight:600}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car > *{flex:0 0 100%;width:100%;max-width:none;aspect-ratio:1;object-fit:cover;scroll-snap-align:start;display:block;background:var(--surface-2)}
.dots{display:flex;justify-content:center;gap:6px;padding-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* post card */
.feed{display:flex;flex-direction:column;gap:20px}
.post{display:flex;flex-direction:column}
.phd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px}
.who{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;flex:1}
.who .av{--s:34px}
.who .wt{min-width:0;display:block}
.who b{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-size:12px;color:var(--ink-2);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;align-items:center;padding:4px 6px 0}
.acts .sp{flex:1}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib.heart[aria-pressed="true"]{color:var(--accent)}
.ib[aria-pressed="true"] svg.i{fill:currentColor}
.cap{padding:0 16px;font-size:14px;overflow-wrap:anywhere}
.cap b{margin-right:4px}
.cmts{padding:6px 16px 0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.cmts li{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cmts span{min-width:0;overflow-wrap:anywhere}
.cform{display:flex;gap:8px;padding:10px 16px 0}
.note{font-size:12px;color:var(--ink-2);text-align:center;padding:4px 16px}

/* profile */
.phead{display:flex;align-items:center;gap:20px}
.phead .av{--s:80px}
.pright{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stats > *{display:block;padding:2px 0;border-radius:8px}
.stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span span,.stats button span{font-size:12px;color:var(--ink-2)}
.pname{font-size:16px;font-weight:700;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ptabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-block:1px solid var(--line)}
.ptabs button{min-height:46px;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.gwrap{container-type:inline-size}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((100cqw - 4px)/3);grid-auto-flow:dense;gap:2px}
.gt{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:var(--surface-2)}
.gt.s12{grid-row:span 2}
.gt.s21{grid-column:span 2}
.gt.s22{grid-row:span 2;grid-column:span 2}
.gt[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border:4px solid var(--accent)}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.gt .multi{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface);color:var(--ink)}
.gt.tile{aspect-ratio:auto;background:oklch(var(--tile-l) var(--tile-c) var(--h))}
.gt.tile .tag{font-size:10px}
.empty{text-align:center;padding:32px 16px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
.confirm{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* account rows */
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
.urow .who .av{--s:46px}
.ulist{display:flex;flex-direction:column}

/* new post */
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:14px;line-height:1}
.addph{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;text-align:center;font-size:12px;font-weight:600}
.addph:hover{background:var(--surface-2)}

/* grid editor */
.gbar{display:flex;flex-direction:column;gap:10px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.gbar .chips{gap:6px}
.gbar .chip{min-height:34px;padding:0 12px;font-size:13px}
.two{display:flex;gap:8px}
.two > *{flex:1;min-width:0}

/* time capsules */
.caprow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.caprow .lock{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.caprow .t{flex:1;min-width:0}
.caprow b{display:block;font-size:15px}
.caprow small{display:block;color:var(--ink-2);font-size:12px}

/* recommendation tuning */
.trow{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.5em;align-items:center;gap:10px;min-height:44px}
.trow label{font-weight:600;font-size:14px}
.trow input{width:100%;accent-color:var(--accent)}
.trow .tval{font-size:12px;color:var(--ink-2);text-align:right}
.trow .tval.off{color:var(--danger);font-weight:600}
.panel{display:block;width:100%;text-align:left;font-size:13px;padding:9px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow-wrap:anywhere}

/* notes */
.strip{align-items:flex-end}
.strip button.me{width:92px}
.bub{max-width:100%;font-size:11px;line-height:1.3;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px 8px;overflow-wrap:anywhere}
.bub span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* bottom menu */
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
.nav button{min-height:54px;display:grid;place-items:center;color:var(--ink)}
.nav button svg.i{width:26px;height:26px}
.nav button[aria-current="page"] svg.i{stroke-width:2.6}
.nav button[aria-current="page"]::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;margin-top:40px}

.toast{position:absolute;left:16px;right:16px;bottom:72px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:5;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .pick,.chip,.fbtn,.ib{transition:background-color .12s,color .12s,border-color .12s}
  .car{scroll-behavior:smooth}
}

/* video */
.gt video,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.vbadge{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.vbadge svg.i{width:14px;height:14px;fill:currentColor}
.likes{padding:0 16px;font-size:14px;font-weight:700}
.btn[disabled]{opacity:.6;cursor:default}

/* start screens */
.splash{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}
.splash > *{max-width:320px}
.splash .btn.wide{max-width:320px}
.brand.big{font-size:52px}
.lgcard{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.lgcard b{display:block;font-size:16px}
.lgcard small{display:block;font-size:12px;color:var(--ink-2)}
/* feed media: inset and shorter than a full square, so a post does not fill the screen */
:root{--stage:#0E0D1A}
.media{padding-inline:16px}
.car,.media .tile{border-radius:14px}
.car > *,.media .tile{aspect-ratio:4/3}
.car video{object-fit:contain;background:var(--stage)}
.chip.aicap{white-space:normal;text-align:left;min-height:0;padding:8px 14px;border-radius:14px;line-height:1.4}
/* several photos in one post: arrows and a counter, so it works with a mouse as well as a swipe */
.carwrap{position:relative}
.car{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center}
.cnav svg.i{width:20px;height:20px;stroke-width:2.4}
.cnav.prev{left:8px}
.cnav.next{right:8px}
.cnav.next svg.i{transform:scaleX(-1)}
.ccount{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
/* comment panel */
.ccnt{font-size:14px;font-weight:700;margin-left:-6px;margin-right:6px;font-variant-numeric:tabular-nums}
.cpanel{margin:8px 16px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}

/* 노래 검색: Apple의 공개 검색 서비스를 씁니다. 게시물에는 곡 페이지 링크와, 눌렀을 때만 나오는 30초 미리듣기가 붙습니다. */
window.SONG_SOURCE = "Apple Music";
window.SONG_SEARCH = function(q){
  return new Promise(function(res, rej){
    var cb = "__song" + Date.now(), s = document.createElement("script"), done = false;
    function fin(){ done = true; try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = function(d){
      fin();
      res(((d && d.results) || []).filter(function(x){ return x && x.trackName; }).map(function(x){ return {t:String(x.trackName), a:String(x.artistName || ""), u:String(x.trackViewUrl || ""), pv:String(x.previewUrl || "")}; }));
    };
    s.onerror = function(){ if (!done){ fin(); rej({code:"network"}); } };
    s.src = "https://itunes.apple.com/search?media=music&entity=song&country=KR&lang=ko_kr&limit=10&term=" + encodeURIComponent(q) + "&callback=" + cb;
    document.head.appendChild(s);
    setTimeout(function(){ if (!done){ fin(); rej({code:"timeout"}); } }, 8000);
  });
};

/* ---------- photos and videos ---------- */
function shrink(file, size, q, asData){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function(){
      var img = new Image();
      img.onerror = rej;
      img.onload = function(){
        var c = document.createElement("canvas"); c.width = c.height = size;
        var s = Math.min(img.width, img.height);
        c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        if (asData){ var d = c.toDataURL("image/jpeg", q); res({data:d, url:d}); }
        else c.toBlob(function(b){ if (b) res({blob:b, url:URL.createObjectURL(b)}); else rej(new Error("encode")); }, "image/jpeg", q);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* a still frame for the grid; if the browser cannot make one, the video itself is shown instead */
function posterOf(url){
  return new Promise(function(res){
    var v = document.createElement("video"), done = false;
    function fin(b){ if (done) return; done = true; res(b || null); }
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    v.addEventListener("loadeddata", function(){ try{ v.currentTime = Math.min(0.1, (v.duration || 1) / 2); }catch(e){ fin(); } });
    v.addEventListener("seeked", function(){
      try{
        var s = Math.min(v.videoWidth, v.videoHeight); if (!s) return fin();
        var c = document.createElement("canvas"); c.width = c.height = 720;
        c.getContext("2d").drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, 720, 720);
        c.toBlob(function(b){ fin(b); }, "image/jpeg", 0.8);
      }catch(e){ fin(); }
    });
    v.addEventListener("error", function(){ fin(); });
    setTimeout(fin, 5000);
    try{ v.load(); }catch(e){ fin(); }
  });
}
function videoType(file){

    D.nick = t.value; ui.touched = true;
    var err = t.value.trim() ? nickError(t.value) : "";
    var m = document.getElementById("nickMsg"), c = document.getElementById("nickCnt");
    if (m){ m.textContent = err || "2~12자. 한글, 영문, 숫자, 밑줄, 마침표."; m.className = "msg" + (err ? " err" : ""); }
    if (c) c.textContent = len(t.value) + "/" + NICK_MAX;
    t.classList.toggle("bad", !!err);
    el = app.querySelector(".av-row .av"); if (el && !D.photo) el.textContent = first(t.value);
  }
  else if (t.id === "bio"){ D.bio = t.value; el = document.getElementById("bioCnt"); if (el) el.textContent = len(t.value) + "/" + BIO_MAX; }
  else if (t.id === "cap"){ N.t = t.value; el = document.getElementById("capCnt"); if (el) el.textContent = len(t.value) + "/" + CAP_MAX; }
  else if (t.id === "ntext"){ ui.nd.t = t.value; el = document.getElementById("ntCnt"); if (el) el.textContent = len(t.value) + "/60"; }
  else if (t.id === "nsong"){ ui.nd.song = t.value; ui.nd.via = ""; }
  else if (t.type === "range" && t.dataset.f){
    var fv = +t.value, ff = t.dataset.f;
    if (fv === 2) delete TUNE.w[ff]; else TUNE.w[ff] = fv;
    t.setAttribute("aria-valuetext", TW[fv]);
    el = document.getElementById("tv-" + ff); if (el){ el.textContent = TW[fv]; el.className = "tval" + (fv === 0 ? " off" : ""); }
    el = document.getElementById("tcount"); if (el) el.textContent = tuneCount();
  }
  else if (t.id === "sq"){ ui.sq = t.value; }
  else if (t.id === "q"){ ui.q = t.value; el = document.getElementById("results"); if (el) el.innerHTML = searchResults(); }
  else if (t.id === "fq"){ ui.fq = t.value; el = document.getElementById("flist"); if (el) el.innerHTML = followList(); }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "ndate"){ N.date = t.value; render(true); return; }
  if (t.type === "range" && t.dataset.f){ savePrivate(); return; }   /* one write when the slider is released */
  if (!t.files || !t.files.length) return;
  if (t.id === "photo"){
    var f = t.files[0];
    if (!/^image\//.test(f.type)){ toast("이미지 파일만 올릴 수 있어요."); render(true); return; }
    shrink(f, 256, 0.85, true).then(function(r){ D.photo = r.data; render(true); }, function(){ toast("사진을 읽지 못했어요. 다른 파일로 다시 시도하세요."); render(true); });
  } else if (t.id === "np"){ addFiles(t.files); }
});

/* redraw what was held back while typing or watching */
document.addEventListener("focusout", function(){ if (ui.stale) setTimeout(function(){ if (ui.stale) soft(); }, 150); });
document.addEventListener("pause", function(){ if (ui.stale) setTimeout(function(){ if (ui.stale) soft(); }, 150); }, true);

/* carousel dots follow the swipe */
document.addEventListener("scroll", function(e){
  var c = e.target; if (!c.classList || !c.classList.contains("car") || !c.clientWidth) return;
  syncCar(c, Math.max(0, Math.min(c.children.length - 1, Math.round(c.scrollLeft / c.clientWidth))));
}, true);

/* ---------- connect ---------- */
function serr(e){
  var c = e && e.code;
  if (c === "revoked"){ ui.ro = true; toast("연결 권한이 바뀌었어요. 페이지를 다시 열어 주세요."); render(true); }
  else if (c === "permission-denied"){ toast("데이터를 읽을 권한이 없어요. 데이터 규칙을 배포했는지 확인해 주세요."); render(true); }
}
function subscribe(){
  db.collection("profiles").limit(1000).onSnapshot(function(s){
    var next = {}; s.docs.forEach(function(d){ next[d.id] = d.data(); }); PROF = next;
    if (S && ME !== "guest" && PROF[ME] && idle("p") && ui.view === "app" && !ui.gedit) S = fromPub(PROF[ME]);
    live();
  }, serr);
  db.collection("posts").orderBy("at", "desc").limit(300).onSnapshot(function(s){
    RP = s.docs.map(function(d){ var x = clone(d.data()); x.id = d.id; return x; }); live();
  }, serr);
  db.collection("likes").limit(1000).onSnapshot(function(s){
    var lk = {}, at = {};
    s.docs.forEach(function(d){ var x = d.data(); if (!x.p || !x.u) return; (lk[x.p] = lk[x.p] || []).push(x.u); if (x.u === ME) at[x.p] = x.at || 0; });
    LK = lk; LKAT = at; live();
  }, serr);
  db.collection("follows").limit(1000).onSnapshot(function(s){
    FOL = s.docs.map(function(d){ var x = d.data(); return {u:x.u, t:x.t}; }).filter(function(x){ return x.u && x.t; }); live();
  }, serr);
  db.collection("comments").limit(1000).onSnapshot(function(s){
    var cm = {};
    s.docs.forEach(function(d){ var x = d.data(); if (!x.p) return; (cm[x.p] = cm[x.p] || []).push({id:d.id, u:x.u, t:x.t || "", at:x.at || 0}); });
    Object.keys(cm).forEach(function(k){ cm[k].sort(function(a, b){ return a.at - b.at; }); });
    CM = cm; live();
  }, serr);
  if (ME !== "guest") db.collection("data/users/" + ME).onSnapshot(function(s){
    var caps = [];
    s.docs.forEach(function(d){
      var x = clone(d.data());
      if (d.id === "state"){ if (idle("s")){ SAVES = x.saves || []; TUNE = x.tune || {w:{}, mute:[]}; if (!TUNE.w) TUNE.w = {}; if (!TUNE.mute) TUNE.mute = []; } }
      else if (d.id.indexOf("cap_") === 0){ x.id = d.id.slice(4); if (!opening[x.id]) caps.push(x); }
    });
    CAPS = caps; if (ui.view === "app") openDue(); live();
  }, serr);
}
/* ---------- connect: Firebase (Google sign-in, Firestore, optional Storage) ---------- */
var auth = null, GU = null, booted = false;
function storageAssets(st){
  return { durable:true,
    upload:function(blob, opt){
      var ext = opt.type === "image/jpeg" ? "jpg" : opt.type === "video/webm" ? "webm" : "mp4";
      var path = "media/" + ME + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + "." + ext, ref = st.ref(path);
      return ref.put(blob, {contentType:opt.type, cacheControl:"public,max-age=31536000"}).then(function(){ return ref.getDownloadURL(); }).then(function(url){ return {id:path, url:url}; }, function(e){
        var c = e && e.code;
        throw {code: c === "storage/unauthorized" || c === "storage/unauthenticated" ? "not_granted" : c === "storage/quota-exceeded" ? "quota_or_state"
                   : c === "storage/bucket-not-found" || c === "storage/project-not-found" || c === "storage/unknown" ? "no_storage" : "upstream_error"};
      });
    },
    delete:function(path){ return st.ref(path).delete(); } };
}
/* ---------- preview without a server: the same app on a small store kept in this browser ---------- */
function localDb(key){
  var store = {}, subs = [], canStore = true;
  try{ store = JSON.parse(localStorage.getItem(key) || "{}") || {}; }catch(e){ store = {}; canStore = false; }
  function fire(){ subs.slice().forEach(function(f){ setTimeout(f, 0); }); }
  function persist(){ if (!canStore) return true; try{ localStorage.setItem(key, JSON.stringify(store)); return true; }catch(e){ return false; } }
  function snap(path){ var d = store[path]; return {id:path.split("/").pop(), exists:d !== undefined, data:function(){ return d === undefined ? undefined : JSON.parse(JSON.stringify(d)); }}; }
  function doc(path){
    return { id:path.split("/").pop(), path:path,
      get:function(){ return Promise.resolve(snap(path)); },
      set:function(data){
        var prev = store[path]; store[path] = JSON.parse(JSON.stringify(data));
        if (!persist()){ if (prev === undefined) delete store[path]; else store[path] = prev; return Promise.reject({code:"quota_exceeded"}); }
        fire(); return Promise.resolve();
      },
      delete:function(){ delete store[path]; persist(); fire(); return Promise.resolve(); },
      onSnapshot:function(n){ var f = function(){ n(snap(path)); }; subs.push(f); setTimeout(f, 0); return function(){}; } };
  }
  function col(path, q){
    q = q || {};
    function run(){
      var pre = path + "/", docs = Object.keys(store).filter(function(k){ return k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") === -1; }).sort().map(snap);
      if (q.o) docs.sort(function(a, b){ var x = a.data()[q.o.f], y = b.data()[q.o.f]; return (x < y ? -1 : x > y ? 1 : 0) * (q.o.d === "desc" ? -1 : 1); });
      if (q.n) docs = docs.slice(0, q.n);
      return {docs:docs, size:docs.length, empty:!docs.length};
    }
    return { path:path,
      orderBy:function(f, d){ return col(path, {o:{f:f, d:d || "asc"}, n:q.n}); },
      limit:function(n){ return col(path, {o:q.o, n:n}); },
      get:function(){ return Promise.resolve(run()); },
      onSnapshot:function(n){ var f = function(){ n(run()); }; subs.push(f); setTimeout(f, 0); return function(){}; },
      doc:function(id){ return doc(path + "/" + (id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      add:function(data){ var r = this.doc(); return r.set(data).then(function(){ return r; }); } };
  }
  return {doc:doc, collection:function(p){ return col(p); }};
}
function enterPreview(){
  ui.preview = true; booted = true; db = localDb("seoul.preview.v1"); assets = null; GU = null; ME = "preview_me"; ui.ro = false;
  var np = document.getElementById("np"); if (np) np.accept = "image/*";
  db.doc("profiles/" + ME).get().then(function(snap){
    if (snap.exists){ S = fromPub(snap.data()); ui.mode = "edit"; ui.view = "app"; }
    else { S = null; startSignup(); }
    subscribe(); derive(); toast("미리보기 모드예요. 글과 사진은 이 기기에만 저장됩니다."); render(false);
  });
}
function setupHTML(){
  return '<main class="splash"><div class="brand big">seoul<i>.</i></div><p class="muted">' + esc(ui.bootMsg || "연결하지 못했어요. 새로 고쳐 주세요.") + "</p>" +
    (ui.canPreview ? '<button class="btn primary wide" style="flex:none" data-act="preview">미리보기로 둘러보기</button>' +
      '<p class="muted small">미리보기는 구글 로그인 없이 들어가고, 글과 사진이 이 기기에만 저장됩니다. 실제 사이트는 README 순서대로 Firebase를 연결하면 켜집니다.</p>' : "") + "</main>";
}
function startSignup(){
  D = blank();
  if (GU){
    D.nick = Array.from(String(GU.displayName || "").replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9_.]/g, "")).slice(0, NICK_MAX).join("");
    if (GU.photoURL && /^https:\/\//.test(GU.photoURL)) D.photo = GU.photoURL;
  }
  ui.view = "signup"; ui.mode = "signup"; ui.step = 0; ui.touched = false;
}
function googleLogin(){
  if (ui.busy) return;
  if (!auth){ ui.loginMsg = "미리보기에서는 구글 로그인 창을 띄울 수 없어요. 실제 사이트에 올리면 이 버튼에서 구글 창이 뜹니다. 지금은 아래 버튼으로 들어가 보세요."; render(false); return; }
  ui.busy = true; ui.loginMsg = ""; render(false);
  var p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  auth.signInWithPopup(p).then(function(){ ui.busy = false; }, function(e){
    var c = e && e.code; ui.busy = false;
    if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment"){ auth.signInWithRedirect(p); return; }
    ui.loginMsg = c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request" ? "로그인 창이 닫혔어요. 다시 눌러 주세요."
      : c === "auth/unauthorized-domain" ? "이 사이트 주소가 Firebase에 등록돼 있지 않아요. Firebase 콘솔의 Authentication > 설정 > 승인된 도메인에 이 주소를 추가해 주세요."
      : c === "auth/operation-not-allowed" ? "Firebase 콘솔의 Authentication > 로그인 방법에서 Google을 켜 주세요."
      : c === "auth/network-request-failed" ? "네트워크에 연결하지 못했어요. 연결을 확인하고 다시 눌러 주세요."
      : "로그인하지 못했어요. 다시 눌러 주세요. (" + (c || "알 수 없는 오류") + ")";
    render(false);
  });
}
function boot(){
  if (!window.firebase || !CONFIG || !CONFIG.apiKey || !CONFIG.projectId || /붙여/.test(CONFIG.apiKey)){
    var noConfig = !CONFIG || !CONFIG.apiKey || !CONFIG.projectId || /붙여/.test(CONFIG.apiKey);
    ui.canPreview = noConfig;
    if (noConfig && window.AUTO_PREVIEW){ ui.view = "login"; render(false); return; }   /* the preview copy starts on the login screen, like the real site */
    ui.bootMsg = noConfig ? "Firebase 설정이 아직 없어요. index.html 맨 위의 CONFIG에 Firebase 설정값을 붙여 넣고 다시 배포해 주세요."
                          : "Firebase를 불러오지 못했어요. 인터넷 연결을 확인하고 새로 고쳐 주세요.";
    ui.view = "nodb"; render(false); return;
  }
  try{ firebase.initializeApp(CONFIG); auth = firebase.auth(); db = firebase.firestore(); }
  catch(e){ ui.bootMsg = "Firebase 설정값이 올바르지 않아요. CONFIG를 다시 확인해 주세요."; ui.view = "nodb"; render(false); return; }
  auth.onAuthStateChanged(function(u){
    if (!u){
      if (booted){ location.reload(); return; }   /* signed out: start clean */
      GU = null; S = null; ME = "guest"; ui.busy = false; ui.view = "login"; render(false); return;
    }
    if (booted) return;
    booted = true; GU = u; ME = u.uid; ui.ro = false; ui.busy = false;
    try{ assets = USE_STORAGE && firebase.storage ? storageAssets(firebase.storage()) : null; }catch(e){ assets = null; }
    var np = document.getElementById("np"); if (np) np.accept = assets ? "image/*,video/*" : "image/*";
    db.doc("profiles/" + ME).get().then(function(snap){
      if (snap.exists){ S = fromPub(snap.data()); ui.mode = "edit"; ui.view = "app"; }
      else { S = null; startSignup(); }
      subscribe(); derive(); render(false);
    }, function(e){
      ui.bootMsg = "데이터베이스에 연결하지 못했어요. Firestore 데이터베이스를 만들고 규칙을 배포했는지 확인해 주세요. (" + ((e && e.code) || "알 수 없는 오류") + ")";
      ui.view = "nodb"; render(false);
    });
  });
}
render(false);
boot();

})();
