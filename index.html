<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit</title>
<meta name="description" content="관심사로 이어지는 SNS">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E2A98">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:dark}
body{margin:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* Orbit — a deep-space look, the same on every device.
   Phone: one column with a top bar, a scrolling middle and a five-button bottom menu.
   Wide screens: menu on the left, the screen in the middle, my card and trends on the right.
   Every interest owns a hue (--h); it colours its planet, its tiles and its dots. */
:root{
  --bg:#4A3BC8;
  --surface:#2E2D96;
  --surface-2:rgba(255,255,255,.09);
  --surface-3:rgba(255,255,255,.17);
  --ink:#FFFFFF;
  --ink-2:#CDD0F7;
  --line:rgba(255,255,255,.17);
  --accent:#7A5CF0;
  --accent-hi:#D2C8FF;
  --accent-ink:#FFFFFF;
  --grad:linear-gradient(90deg,#7A5CF0,#4F6BE6);
  --accent-soft:rgba(150,130,255,.3);
  --danger:#FFB4AC;
  --ok:#74EBBD;
  --heart:#FF86B4;
  --tile-l:52%;
  --tile-c:0.15;
  --tile-ink:#FFFFFF;
  --stage:#17145A;
  --scrim:rgba(20,14,84,.62);
  --shadow:0 20px 50px rgba(22,12,100,.45);
  --stars:radial-gradient(1px 1px at 8% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 72%,rgba(255,255,255,.8) 50%,transparent 51%),
          radial-gradient(1px 1px at 37% 34%,rgba(255,255,255,.7) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 52% 12%,#fff 50%,transparent 51%),
          radial-gradient(1px 1px at 63% 58%,rgba(255,255,255,.75) 50%,transparent 51%),radial-gradient(1px 1px at 74% 26%,rgba(255,255,255,.6) 50%,transparent 51%),
          radial-gradient(1.5px 1.5px at 86% 78%,rgba(255,255,255,.8) 50%,transparent 51%),radial-gradient(1px 1px at 94% 40%,#fff 50%,transparent 51%),
          radial-gradient(1px 1px at 45% 88%,rgba(255,255,255,.65) 50%,transparent 51%),radial-gradient(1px 1px at 15% 46%,rgba(255,255,255,.55) 50%,transparent 51%);
  --display:"Outfit","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  background:radial-gradient(60% 50% at 10% 6%,rgba(226,130,255,.6),transparent 62%),radial-gradient(55% 45% at 90% 10%,rgba(120,176,255,.6),transparent 62%),
    radial-gradient(60% 55% at 84% 96%,rgba(182,118,255,.55),transparent 62%),radial-gradient(50% 50% at 8% 92%,rgba(92,150,255,.55),transparent 62%),
    linear-gradient(135deg,#6444DC,#4A5FE2 55%,#7350DE);background-attachment:fixed}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button[disabled]{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
::placeholder{color:var(--ink-2);opacity:.8}
[hidden]{display:none!important}

.shell{height:100%;max-width:460px;margin-inline:auto;background:var(--surface);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:500px){.shell{border-inline:1px solid var(--line)}}
.side,.rail{display:none}
.col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 10px;min-height:56px}
.top.deep{padding-inline:6px}
.brand{font-family:var(--display);font-weight:600;font-size:22px;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:9px}
.omark{width:1.3em;height:1.3em;flex:none;display:block}
.brand.big{flex-direction:column;gap:14px;font-size:38px}
.brand.big .omark{width:88px;height:88px;filter:drop-shadow(0 10px 30px rgba(109,90,230,.6))}
.ttl{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top.deep .ttl{flex:1;text-align:center;font-size:17px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ink)}
.iconbtn.sm{width:36px;height:36px;color:var(--ink-2)}
.iconbtn.sm svg.i{width:20px;height:20px}
button.iconbtn:hover,.ib:hover{background:var(--surface-2)}
.link{color:var(--ink-2);font-size:13px;font-weight:500;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.link.sm{font-size:12px;padding:0 4px;text-decoration:none;color:var(--accent-hi);font-weight:600}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib.more svg.i,.iconbtn svg.i{stroke-width:2}
.tsearch{display:none}
.tav{display:none}
.topacts{display:flex;align-items:center}
.nbell{position:relative}
.ndot{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* scrolling middle */
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:4px 32px;scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
.scroll.form{padding-inline:16px;gap:20px;padding-top:8px}
.scroll > *{flex:none}
.pad{padding-inline:16px}
.h1{font-size:23px;line-height:1.3;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.h2{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin-top:6px}
.h3{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.group{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}

/* the planet: a lit ball with a ring, tinted by --h where one is set */
.planet{--ps:150px;position:absolute;width:var(--ps);height:var(--ps);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#D2C4FF 0%,#9272F4 26%,#5636CC 58%,#1B1160 100%);
  box-shadow:0 0 calc(var(--ps)*.4) rgba(124,92,255,.5),inset calc(var(--ps)*-.1) calc(var(--ps)*-.12) calc(var(--ps)*.26) rgba(8,4,40,.7)}
.planet i{position:absolute;left:-34%;right:-34%;top:37%;height:26%;border-radius:50%;border:max(2px,calc(var(--ps)*.022)) solid rgba(220,208,255,.8);border-top-color:transparent;transform:rotate(-16deg)}
.planet.sm{--ps:64px}
.cover .planet,.cdot{background:radial-gradient(circle at 32% 28%,oklch(86% .09 var(--h)) 0%,oklch(62% .17 var(--h)) 30%,oklch(42% .16 var(--h)) 62%,oklch(20% .08 var(--h)) 100%)}
.cover .planet{box-shadow:0 0 26px oklch(60% .17 var(--h) / .55),inset -7px -8px 16px rgba(4,3,20,.7)}

/* signup steps */
.steps{list-style:none;margin:0;padding:4px 16px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps button{width:100%;text-align:left;font-size:12px;font-weight:500;color:var(--ink-2);padding:8px 0 2px;border-top:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .done button{border-top-color:var(--accent-hi);color:var(--ink)}
.steps .on button{border-top-color:var(--accent);color:var(--ink);font-weight:700}

.bar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.btn{white-space:nowrap;flex:none;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(109,90,230,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border:1px solid var(--line);background:var(--surface-2)}
.btn.ghost:hover,.btn.small:hover{background:var(--surface-3)}
.btn.small{min-height:38px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.btn.wide{width:100%}
.btn.danger{background:var(--danger);color:#2A0704;min-height:40px;border-radius:12px;font-size:14px}

/* avatar */
.av{--s:96px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:oklch(var(--tile-l) var(--tile-c) var(--h,285));color:var(--tile-ink);font-family:var(--display);font-weight:600;font-size:calc(var(--s)*.44);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.ring{display:inline-grid;flex:none;border-radius:50%;padding:2px;border:2px solid var(--line)}
.ring.on{border-color:var(--accent)}
.avw{position:relative;display:inline-grid;flex:none}
.avw .on{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.av-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.av-ctl{display:flex;flex-direction:column;gap:10px;min-width:0}
.av-btns{display:flex;gap:8px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:oklch(var(--tile-l) var(--tile-c) var(--h));border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* form fields */
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.input,.textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:13px 14px;font-size:16px}
.input.sm{padding:10px 14px;border-radius:12px;min-width:0;font-size:15px}
.textarea{min-height:120px;resize:vertical;line-height:1.5}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent)}
.input.bad{border-color:var(--danger)}
.hint{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.hint .msg{min-width:0}
.hint .msg.err{color:var(--danger);font-weight:500}
.hint .cnt{font-variant-numeric:tabular-nums;flex:none}
.count.err{color:var(--danger);font-weight:600}

/* chips and tabs */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.rowx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-inline:16px}
.chips.rowx .chip{flex:none}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{color:var(--ink-2);font-size:12px}
button.chip:hover{background:var(--surface-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.static{cursor:default;min-height:26px;padding:0 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip.aicap{white-space:normal;text-align:left;min-height:0;padding:8px 14px;border-radius:14px;line-height:1.4}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;min-height:36px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.ptabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--line)}
.ptabs button{min-height:46px;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-hi)}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pick{position:relative;min-height:74px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.pick .dot{width:18px;height:18px;border-radius:50%;background:oklch(var(--tile-l) var(--tile-c) var(--h))}
.pick:hover{background:var(--surface-3)}
.pick[aria-pressed="true"]{border-color:transparent;background:oklch(var(--tile-l) var(--tile-c) var(--h));color:var(--tile-ink)}
.pick[aria-pressed="true"] .dot{background:var(--tile-ink)}
.pick .ck{position:absolute;top:10px;right:10px;font-size:13px;opacity:0}
.pick[aria-pressed="true"] .ck{opacity:1}

.follow{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .t{min-width:0}
.frow b{display:block;font-size:15px}
.frow small{color:var(--ink-2);font-size:12px}
.fbtn{min-height:34px;min-width:76px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);flex:none}
.fbtn:hover{filter:brightness(1.1)}
.fbtn[aria-pressed="true"]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.fbtn.wide{width:100%;min-height:36px}

/* home: banner, notes, community cards */
.hero{position:relative;overflow:hidden;margin:4px 16px 0;border-radius:20px;padding:22px 20px;min-height:170px;display:flex;align-items:center;border:1px solid #3A2FA0;
  background:var(--stars),radial-gradient(120% 150% at 88% 30%,#5334DA 0%,#2C1C97 36%,#150F4C 72%,#0F0B36 100%)}
.herot{position:relative;z-index:1;max-width:66%;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero h1{font-family:var(--display);font-size:25px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hero p{font-size:13.5px;color:#DCD6FF;line-height:1.5}
.hero .btn{flex:none;min-height:40px;border-radius:12px;font-size:14px;padding:0 16px;margin-top:2px}
.hero .planet{--ps:150px;right:-34px;top:50%;margin-top:-75px}

.strip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 4px;align-items:flex-end}
.strip button{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px}
.strip button.me{width:92px}
.strip .lbl{width:100%;font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.strip .av{--s:56px}
.bub{max-width:100%;font-size:11px;line-height:1.3;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px 8px;overflow-wrap:anywhere}
.bub span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.crow2{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 16px 2px;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.crow2 .ccard{flex:0 0 164px;scroll-snap-align:start}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);overflow:hidden}
.ccov{display:block;width:100%}
.cover{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;
  background:var(--stars),radial-gradient(130% 130% at 80% 20%,oklch(38% .15 var(--h)) 0%,oklch(22% .09 var(--h)) 55%,#0B0A1E 100%)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .planet{right:10px;top:10px}
.cword{position:absolute;left:12px;bottom:8px;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.ccb{display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;flex:1}
.ccn{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;text-align:left;flex:1}
.ccn b{display:block;font-size:14.5px;line-height:1.3}
.ccn small{display:block;font-size:12px;color:var(--accent-hi);font-weight:600}
.ccn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:4px}
.ccb .fbtn{width:100%}
.chero .cover{aspect-ratio:auto;height:132px}
.chero .cover .planet{--ps:96px;right:22px;top:16px}
.chero .cword{font-size:34px;left:16px;bottom:12px}
.cmeta{display:flex;align-items:center;gap:12px}
.cdot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-grid;place-items:center}
.cdot.lg{width:44px;height:44px;box-shadow:0 0 18px oklch(60% .17 var(--h) / .5)}
.cdot.plus{background:var(--surface-3);color:var(--ink-2);font-size:12px;line-height:1}

/* word tiles and post media */
.tile{position:relative;container-type:inline-size;aspect-ratio:1;overflow:hidden;background:oklch(var(--tile-l) var(--tile-c) var(--h));color:var(--tile-ink);max-width:100%;display:block;width:100%}
.tile .word{position:absolute;left:5cqw;bottom:5cqw;font-family:var(--display);font-weight:700;font-size:30cqw;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.tile .tag{position:absolute;left:5cqw;top:5cqw;font-size:14px;font-weight:600}
.media{padding-inline:16px}
.carwrap{position:relative}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:16px}
.car > *{flex:0 0 100%;width:100%;max-width:none;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;display:block;background:var(--surface-2)}
.media .tile{border-radius:16px;aspect-ratio:4/3}
.car video{object-fit:contain;background:var(--stage)}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(11,10,30,.8);color:var(--ink);display:grid;place-items:center}
.cnav svg.i{width:20px;height:20px;stroke-width:2.4}
.cnav.prev{left:8px}
.cnav.next{right:8px}
.cnav.next svg.i{transform:scaleX(-1)}
.ccount{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(11,10,30,.8);color:var(--ink);font-variant-numeric:tabular-nums}
.dots{display:flex;justify-content:center;gap:6px;padding-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent-hi)}
.vbadge{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:rgba(11,10,30,.8);color:var(--ink);display:grid;place-items:center}
.vbadge svg.i{width:13px;height:13px;fill:currentColor}
.multi{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(11,10,30,.8);color:var(--ink)}
.vtap{position:relative;padding:0;background:var(--stage);color:var(--tile-ink);overflow:hidden}
.vtap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.vtapc{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px}
.vtapc svg.i{width:46px;height:46px;fill:currentColor}
.vtapc b{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--stage)}

/* post cards in a list */
.feed{display:flex;flex-direction:column;gap:12px;padding-inline:16px}
.pc{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.pcimg{position:relative;flex:none;width:104px;height:104px;border-radius:12px;overflow:hidden;background:var(--surface-3);align-self:flex-start;display:block}
.pcimg img{width:100%;height:100%;object-fit:cover;display:block}
.pcimg .tile{height:100%}
.pcv{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2)}
.pcv svg.i{fill:currentColor;width:28px;height:28px}
.pcb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pch{display:flex;align-items:center;gap:6px}
.who{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;flex:1}
.who .wt,.wt{min-width:0;display:block}
.wt b{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt small{display:block;font-size:12px;color:var(--ink-2);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ink-2)}
.pch .ib{margin:-6px -6px -6px 0}
.pct{display:block;width:100%;text-align:left;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.pct b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15.5px;line-height:1.4;margin-bottom:2px}
.pct span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2);white-space:pre-line}
.pct span:only-child{color:var(--ink);-webkit-line-clamp:3}
.dchip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-hi);font-weight:600;min-width:0}
.dchip svg.i{width:14px;height:14px;stroke-width:2.2}
.dchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pca{display:flex;align-items:center;gap:2px;margin:auto 0 -6px -8px;padding-top:2px}
.pa{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;min-width:40px;padding:0 8px;border-radius:10px;color:var(--ink-2);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pa svg.i{width:19px;height:19px}
.pa:hover{background:var(--surface-3);color:var(--ink)}
.pa.heart[aria-pressed="true"]{color:var(--heart)}
.pa[aria-pressed="true"]{color:var(--accent-hi)}
.pa[aria-pressed="true"] svg.i{fill:currentColor}
.note{font-size:12px;color:var(--ink-2);text-align:center;padding:4px 16px}

/* one post, opened */
.post{display:flex;flex-direction:column;gap:12px}
.phd{display:flex;align-items:center;gap:10px;padding:6px 16px 0}
.phd .more{margin-right:-8px}
.dtext{padding:0 16px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.dtext h2{font-size:19px;line-height:1.35;letter-spacing:-.01em}
.dtext p{white-space:pre-wrap;color:var(--ink)}
.dtext.big p{font-size:17px;line-height:1.6}
.dloc{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-2)!important}
.dloc svg.i{width:15px;height:15px}
.acts{display:flex;align-items:center;gap:4px;margin-inline:16px;padding:4px 0;border-block:1px solid var(--line)}
.acts .sp{flex:1}
.acts .pa{font-size:14px}
.acts .pa svg.i{width:22px;height:22px}
.cpanel{margin:0 16px;display:flex;flex-direction:column;gap:14px}
.cpanel .h3{color:var(--ink);font-size:15px}
.clist{display:flex;flex-direction:column;gap:16px}
.clist li{display:flex;gap:10px;align-items:flex-start}
.clist li.rep{margin-left:46px}
.cav{flex:none;border-radius:50%;display:block}
.cbody{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.cbody small{color:var(--ink-2);font-size:12px;margin-left:6px}
.cbody p{margin-top:1px}
.cacts{display:flex;gap:14px;margin-top:4px}
.cact{font-size:12px;font-weight:600;color:var(--ink-2);min-height:28px}
.cact:hover{color:var(--ink)}
.cact[aria-pressed="true"]{color:var(--heart)}
.sidetag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;line-height:18px;vertical-align:1px}
.sidetag.pro{background:rgba(87,217,163,.16);color:var(--ok)}
.sidetag.con{background:rgba(255,143,135,.16);color:var(--danger)}
.bar.cbar,.bar.dmform{flex-direction:column;gap:8px;padding:10px 16px}
.crow{display:flex;gap:8px;align-items:center}
.crow .input{border-radius:999px;padding-inline:16px}
.sendbtn{width:44px;height:44px;border-radius:50%;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.sendbtn svg.i{width:20px;height:20px}
.sendbtn:hover{filter:brightness(1.1)}
.replyto{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--accent-hi);font-weight:600}
.sides .chip{min-height:30px;font-size:12.5px}
.cform{display:flex;gap:8px}

/* debates */
.vote{margin:0 16px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vbtn{min-height:44px;border-radius:12px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--surface)}
.vbtn b{margin-left:4px;font-variant-numeric:tabular-nums}
.vbtn.pro{color:var(--ok)}
.vbtn.con{color:var(--danger)}
.vbtn.pro[aria-pressed="true"]{background:rgba(87,217,163,.16);border-color:var(--ok)}
.vbtn.con[aria-pressed="true"]{background:rgba(255,143,135,.16);border-color:var(--danger)}
.vbar{height:8px;border-radius:999px;background:var(--danger);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--ok)}

/* songs */
.songbar{display:flex;align-items:center;gap:8px;margin:0 16px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:13px}
.songbar .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songbar .st small{display:block;color:var(--ink-2);font-size:11px}
.songbar a{flex:none;color:var(--accent-hi);font-size:12px;font-weight:600;text-underline-offset:3px}
.snote{width:20px;text-align:center;font-weight:700}
.splay{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.splay svg.i{width:14px;height:14px;fill:currentColor}
.splay[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.songchip{min-height:34px;font-size:13px;color:var(--ink);white-space:normal;padding-block:6px;border-radius:14px}
.slist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:block;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--surface-2)}
.srow b{display:block;font-size:14px;overflow-wrap:anywhere}
.srow small{display:block;color:var(--ink-2);font-size:12px;overflow-wrap:anywhere}

/* profile */
.pcover{position:relative;height:118px;overflow:hidden;background:var(--stars),radial-gradient(120% 160% at 78% 10%,#5334DA 0%,#2A1B8F 40%,#120E44 78%,#0B0A1E 100%)}
.pcover .planet{--ps:120px;right:24px;top:-28px}
.phead2{margin-top:-44px;position:relative;gap:12px}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.prow .ring{background:var(--surface);border-color:var(--surface)}
.prow .ring.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:4px}
.pbtns .fbtn{min-height:38px}
.pname{font-family:var(--display);font-size:20px;font-weight:600;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.onl{font-family:var(--body);font-size:12px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.onl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stats > *{display:block;padding:4px 0;border-radius:10px}
.stats button:hover{background:var(--surface-2)}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}
.stats span span,.stats button span{font-size:12px;color:var(--ink-2)}
.pbio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.panel{display:block;width:100%;text-align:left;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow-wrap:anywhere}
.gtool{display:flex;justify-content:flex-end;padding-block:8px 2px}
.gwrap{container-type:inline-size;padding:8px 16px 0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((100cqw - 12px)/3);grid-auto-flow:dense;gap:6px}
.gt{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:var(--surface-2);border-radius:10px}
.gt.s12{grid-row:span 2}
.gt.s21{grid-column:span 2}
.gt.s22{grid-row:span 2;grid-column:span 2}
.gt[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border:3px solid var(--accent-hi);border-radius:10px}
.gt img,.gt video,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.gt.tile{aspect-ratio:auto;background:oklch(var(--tile-l) var(--tile-c) var(--h))}
.gt.tile .tag{font-size:10px}
.gt.ttile{padding:8px;text-align:left;display:flex;align-items:flex-end;font-size:11.5px;line-height:1.4;overflow-wrap:anywhere;
  background:linear-gradient(160deg,oklch(34% .12 var(--h)),oklch(20% .07 var(--h)))}
.gt.ttile span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.about{padding-top:14px;gap:18px}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:center;font-size:14px}
.empty b{color:var(--ink);font-size:15px}
.confirm{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* rows: accounts, notifications, messages, rankings */
.urow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
.urow .who .av{--s:46px}
.ulist{display:flex;flex-direction:column}
.nlist{display:flex;flex-direction:column;gap:8px;padding-inline:16px}
.nrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:left;width:100%}
.nrow.new{border-color:var(--accent);background:var(--accent-soft)}
button.nrow:hover,.trow2:hover{background:var(--surface-3)}
.nrow > svg.i,.trow2 > svg.i{width:18px;height:18px;color:var(--ink-2)}
.ntext{flex:1;min-width:0;text-align:left;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.ntext small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.nthumb{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-2)}
.nthumb img{width:100%;height:100%;object-fit:cover;display:block}
.nthumb svg.i{width:20px;height:20px;fill:currentColor}
.nthumb .tx{font-size:10px;line-height:1.3;padding:4px;text-align:center;overflow:hidden}
.ctime{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--ink-2)}
.undot{width:10px;height:10px;border-radius:50%;background:var(--accent-hi);display:block}
.trow2{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:left;width:100%}
.rank{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.trow2 .cdot{width:30px;height:30px}
.tt{flex:1;min-width:0;display:block}
.tt b{display:block;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbar{display:flex;align-items:center;gap:8px}
#results,#cres,#dres{display:flex;flex-direction:column;gap:16px}
.npop{position:absolute;left:12px;right:12px;top:64px;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-3);color:var(--ink);border:1px solid var(--accent);box-shadow:var(--shadow);text-align:left;font-size:14px;line-height:1.4}
.npop .av{--s:36px}
.npop .nt{flex:1;min-width:0;overflow-wrap:anywhere}
.npop .nthumb{width:44px;height:44px}

/* messages */
.dmlist{display:flex;flex-direction:column;gap:6px;padding-block:8px}
.dday{align-self:center;font-size:11.5px;color:var(--ink-2);padding:6px 0}
.bub2{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.bub2 p{white-space:pre-wrap}
.bub2 small{display:block;font-size:10.5px;opacity:.75;margin-top:2px;text-align:right}
.bub2.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bub2.you{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}

/* new post */
.nwho{display:flex;align-items:center;gap:10px}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tool{min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tool svg.i{width:22px;height:22px;color:var(--accent-hi)}
.tool:hover:not([disabled]){background:var(--surface-3);color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(11,10,30,.85);color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:14px;line-height:1}
.addph{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:22px}
.addph:hover{background:var(--surface-2)}
.locf{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.locf svg.i{width:20px;height:20px}

/* grid editor, capsules, tuning */
.gbar{display:flex;flex-direction:column;gap:10px;margin:8px 16px 0;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.gbar .chips{gap:6px}
.gbar .chip{min-height:34px;padding:0 12px;font-size:13px;background:var(--surface)}
.gbar .chip[aria-pressed="true"]{background:var(--accent)}
.two{display:flex;gap:8px}
.two > *{flex:1;min-width:0}
.caprow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.caprow .lock{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent-hi)}
.caprow .t{flex:1;min-width:0}
.caprow b{display:block;font-size:15px}
.caprow small{display:block;color:var(--ink-2);font-size:12px}
.trow{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.5em;align-items:center;gap:10px;min-height:44px}
.trow label{font-weight:600;font-size:14px}
.trow input{width:100%;accent-color:var(--accent)}
.trow .tval{font-size:12px;color:var(--ink-2);text-align:right}
.trow .tval.off{color:var(--danger);font-weight:600}

/* start screens */
.splash{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center;
  background:var(--stars),radial-gradient(90% 60% at 50% 0%,rgba(109,90,230,.35),transparent 70%)}
.splash > *{max-width:320px}
.splash .btn.wide{max-width:320px}
.lgcard{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.lgcard b{display:block;font-size:16px}
.lgcard small{display:block;font-size:12px;color:var(--ink-2)}

/* bottom menu, floating button, sheets */
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
.nav button{min-height:56px;display:grid;place-items:center;color:var(--ink-2)}
.nav button svg.i{width:25px;height:25px}
.nav button[aria-current="page"]{color:var(--accent-hi)}
.nav button[aria-current="page"] svg.i{stroke-width:2.3}
.nav .plus span{width:46px;height:38px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(109,90,230,.45)}
.nav .plus svg.i{width:22px;height:22px;stroke-width:2.4}
.fab{position:absolute;right:16px;bottom:72px;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 26px rgba(109,90,230,.55);z-index:3}
.fab:hover{filter:brightness(1.1)}
.toast{position:absolute;left:16px;right:16px;bottom:74px;background:var(--ink);color:#14122E;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:9;text-align:center}
.scrim{position:absolute;inset:0;z-index:7;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.stitle{padding:10px 8px 6px;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.sbtn{min-height:48px;padding:0 12px;border-radius:12px;text-align:left;font-size:15px;font-weight:600}
.sbtn:hover{background:var(--surface-3)}
.sbtn.danger{color:var(--danger)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.rtxt{min-width:0;font-size:14px;overflow-wrap:anywhere}
.rtxt b,.rtxt span,.rtxt small{display:block}
.rtxt small{color:var(--ink-2);font-size:12px;margin-top:2px}
.racts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
.robar{margin:0;padding:8px 16px;font-size:12px;background:var(--accent-soft);color:var(--ink);text-align:center}

/* communities: kinds beside the grid */
.cwrap{display:flex;flex-direction:column;gap:14px}
.ccats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-inline:16px}
.ccat{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.ccat svg.i{width:16px;height:16px}
.ccat .cdot{width:16px;height:16px}
.ccat:hover{color:var(--ink)}
.ccat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trow2.split{padding-right:10px}

function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function blank(){ return {nick:"", hue:18, photo:"", bio:"", fields:[], topics:[], follows:[], joinedAt:null, note:null, seen:0, layout:{order:[], size:{}}}; }
function fromPub(x){
  var b = blank(), k; x = x || {};
  for (k in b) if (x[k] != null) b[k] = clone(x[k]);
  if (!b.layout || !b.layout.order) b.layout = {order:[], size:{}};
  if (!b.layout.size) b.layout.size = {};
  b.fields = b.fields.filter(function(id){ return FBY[id]; });
  return b;
}
function draft(){ return {items:[], t:"", f:"", cap:false, when:"1y", date:"", song:null, debate:false, topic:"", loc:""}; }
function snip(t, n){ var a = Array.from(String(t || "")); return a.length > n ? a.slice(0, n).join("") + "…" : a.join(""); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function len(s){ return Array.from(s).length; }
function has(a, v){ return a.indexOf(v) !== -1; }
function toggle(a, v){ var i = a.indexOf(v); if (i === -1) a.push(v); else a.splice(i,1); }
function first(s){ return Array.from((s || "").trim())[0] || "?"; }
function p2(n){ return (n < 10 ? "0" : "") + n; }
function ymd(ms){ var d = new Date(ms); return d.getFullYear() + "." + p2(d.getMonth() + 1) + "." + p2(d.getDate()); }
function longDate(ms){ var d = new Date(ms); return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
function isoDay(plus){ var d = new Date(); d.setDate(d.getDate() + plus); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function ago(ms){
  var s = Math.max(0, Date.now() - ms) / 1000;
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "일 전";
  return ymd(ms);
}

function ptime(p){ return p.openedAt || p.at || 0; }
function notifs(){
  var mine = {}, myCm = {}, since = {}, out = [];

  FOL.forEach(function(x){ if (x.u === ME) since[x.t] = x.at || 0; });
  RP.map(realPost).forEach(function(p){ if (!p.mine && visible(p) && since[p.a] != null && ptime(p) >= since[p.a]) out.push({k:"post:" + p.id, type:"post", u:p.a, pid:p.id, at:ptime(p)}); });
  LKD.forEach(function(l){ if (l.u !== ME && mine[l.p] && !has(BLOCKS, l.u)) out.push({k:"like:" + l.p + ":" + l.u, type:"like", u:l.u, pid:l.p, at:l.at}); });
  Object.keys(CM).forEach(function(pid){ CM[pid].forEach(function(c){ if (c.u === ME) myCm[c.id] = 1; }); });
  Object.keys(CM).forEach(function(pid){ CM[pid].forEach(function(c){
    if (c.u === ME || has(BLOCKS, c.u)) return;
    if (c.re && myCm[c.re]) out.push({k:"re:" + c.id, type:"reply", u:c.u, pid:pid, at:c.at, t:c.t});
    else if (mine[pid]) out.push({k:"cm:" + c.id, type:"cmt", u:c.u, pid:pid, at:c.at, t:c.t});
  }); });
  FOL.forEach(function(x){ if (x.t === ME && x.u !== ME && !has(BLOCKS, x.u)) out.push({k:"fol:" + x.u, type:"fol", u:x.u, at:x.at || 0}); });
  return out.sort(function(a, b){ return b.at - a.at; }).slice(0, 50);
}

/* ---------- trends: what is lively right now ---------- */
function trendPosts(){
  var now = Date.now();
  return RP.map(realPost).filter(function(p){ return visible(p) && now - ptime(p) < 7 * 864e5 && engage(p) > 0; })
    .map(function(p){ return {p:p, s:engage(p) / Math.pow((now - ptime(p)) / 36e5 + 2, 0.6)}; })
    .sort(function(a, b){ return b.s - a.s; }).slice(0, 5).map(function(x){ return x.p; });
}
function trendTags(){
  var now = Date.now(), cnt = {};
  RP.map(realPost).forEach(function(p){
    if (!visible(p) || now - ptime(p) > 14 * 864e5) return;
    var seen = {}; (String(p.t).match(/#[0-9A-Za-z_ㄱ-ㆎ가-힣]{1,20}/g) || []).forEach(function(t){ if (!seen[t]){ seen[t] = 1; cnt[t] = (cnt[t] || 0) + 1; } });
  });
  return Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; }).slice(0, 8).map(function(t){ return {t:t, n:cnt[t]}; });
}
function trendFields(){
  var now = Date.now();

    var posts = commPosts(F.id), week = posts.filter(function(p){ return now - ptime(p) < 7 * 864e5; });
    return {F:F, mem:members(F.id).length, posts:posts.length, s:week.reduce(function(n, p){ return n + 2 + engage(p); }, 0) + members(F.id).length};

}

function songPlay(id){

function spotifyMsg(e){
  var c = e && e.code;
  if (c === "read_fail") return "곡 정보를 읽지 못했어요. 직접 적어 주세요.";
  if (c === "needs_reauth") return "Spotify 로그인이 필요해요. Claude 설정의 커넥터에서 Spotify를 다시 연결한 뒤 눌러 주세요.";
  if (c === "server_not_connected" || c === "selection_required" || c === "server_not_found") return "Spotify가 연결돼 있지 않아요. Claude 설정의 커넥터에서 Spotify를 추가해 주세요.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "not_granted" || c === "consent_required" || c === "blocked_by_policy") return "이 앱에서 Spotify를 쓰도록 허용되지 않았어요. 다시 누르면 허용할지 물어봅니다.";
  if (c === "tool_error") return "Spotify가 곡 정보를 주지 않았어요. 재생 중인지 확인해 주세요.";
  if (c === "capability_disabled" || c === "capability_removed") return "이 화면에서는 Spotify 연동을 쓸 수 없어요. 직접 적어 주세요.";

function shrink(file, size, q, asData){

    fr.onload = function(){
      var img = new Image();
      img.onerror = rej;
      img.onload = function(){
        var c = document.createElement("canvas"); c.width = c.height = size;
        var s = Math.min(img.width, img.height);
        c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        if (asData){ var d = c.toDataURL("image/jpeg", q); res({data:d, url:d}); }
        else c.toBlob(function(b){ if (b) res({blob:b, url:URL.createObjectURL(b)}); else rej(new Error("encode")); }, "image/jpeg", q);
      };

  });
}

    v.addEventListener("seeked", function(){

        var s = Math.min(v.videoWidth, v.videoHeight); if (!s) return fin();

    });

document.addEventListener("submit", function(e){
  var f = e.target; if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  if (f.dataset.form === "mute"){
    var mi = f.querySelector("input"), k = mi.value.trim();
    if (!k){ mi.focus(); return; }
    if (TUNE.mute.length >= 12){ toast("낱말은 12개까지 넣을 수 있어요."); render(true); return; }
    if (!TUNE.mute.some(function(x){ return x.toLowerCase() === k.toLowerCase(); })) TUNE.mute.push(k);
    savePrivate(); render(true); mi = document.getElementById("mute"); if (mi) mi.focus();
    return;
  }
  if (f.dataset.form === "song"){
    var sqi = f.querySelector("input"), sq = sqi.value.trim();
    if (!sq){ sqi.focus(); return; }
    ui.sq = sq; songFind(sq); return;
  }
  if (f.dataset.form === "tsearch"){
    var tqi = f.querySelector("input"); ui.q = tqi.value.trim(); tqi.value = ""; ui.stab = "all"; tab("search");
    return;
  }
  if (f.dataset.form === "dm"){
    if (!need()) return;
    var di = f.querySelector("input"), dv = di.value.trim(), dl = DM[chatId(f.dataset.id)] || [], dlast = dl.length ? dl[dl.length - 1] : null;
    if (!dv){ di.focus(); return; }
    if (dlast && dlast.u === ME && Date.now() - dlast.at < 800){ return; }   /* one message at a time */
    di.value = ""; sendDM(f.dataset.id, dv); di.focus();
    return;
  }
  if (f.dataset.form !== "cmt" || !need()) return;
  var id = f.dataset.id, inp = f.querySelector("input"), v = inp.value.trim();
  if (!v){ inp.focus(); return; }
  /* slow down a flood: at most 5 comments a minute, and not the same words twice in a row on one post */
  var nowC = Date.now(), mineC = [];
  Object.keys(CM).forEach(function(k){ CM[k].forEach(function(x){ if (x.u === ME) mineC.push({p:k, t:x.t, at:x.at}); }); });
  if (mineC.filter(function(x){ return nowC - x.at < 60000; }).length >= 5){ toast("댓글을 너무 빨리 달고 있어요. 잠시 뒤에 다시 써 주세요."); render(true); return; }
  if (mineC.some(function(x){ return x.p === id && x.t === v && nowC - x.at < 300000; })){ toast("같은 댓글을 연달아 달 수 없어요."); render(true); return; }
  var c = {p:id, u:ME, t:v, at:nowC}, cp = getPost(id), tmpC = {id:"tmp" + nowC, u:ME, t:v, at:nowC};
  if (ui.reply && ui.reply.pid === id){ c.re = ui.reply.cid; tmpC.re = c.re; }
  if (cp && cp.debate && ui.side){ c.side = ui.side; tmpC.side = c.side; }
  ui.reply = null;
  inp.value = "";
  (CM[id] = CM[id] || []).push(tmpC);
  ui.cshow[id] = Math.max(ui.cshow[id] || CPAGE, CM[id].length); /* my new comment is the latest, so open far enough to show it */
  db.collection("comments").add(c).catch(werr);
  render(true);
  var el = document.getElementById("c-" + id); if (el) el.focus();
});

  }, serr);
  db.collection("comments").limit(1000).onSnapshot(function(s){

function storageAssets(st){
  return { durable:true,
    upload:function(blob, opt){
      var ext = opt.type === "image/jpeg" ? "jpg" : opt.type === "video/webm" ? "webm" : "mp4";
      var path = "media/" + ME + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + "." + ext, ref = st.ref(path);
      return ref.put(blob, {contentType:opt.type, cacheControl:"public,max-age=31536000"}).then(function(){ return ref.getDownloadURL(); }).then(function(url){ return {id:path, url:url}; }, function(e){
        var c = e && e.code;

      });
    },
    delete:function(path){ return st.ref(path).delete(); } };
}
/* ---------- preview without a server: the same app on a small store kept in this browser ---------- */
function localDb(key){
  var store = {}, subs = [], canStore = true;
  try{ store = JSON.parse(localStorage.getItem(key) || "{}") || {}; }catch(e){ store = {}; canStore = false; }
  function fire(){ subs.slice().forEach(function(f){ setTimeout(f, 0); }); }
  function persist(){ if (!canStore) return true; try{ localStorage.setItem(key, JSON.stringify(store)); return true; }catch(e){ return false; } }
  function snap(path){ var d = store[path]; return {id:path.split("/").pop(), exists:d !== undefined, data:function(){ return d === undefined ? undefined : JSON.parse(JSON.stringify(d)); }}; }
  function doc(path){
    return { id:path.split("/").pop(), path:path,
      get:function(){ return Promise.resolve(snap(path)); },
      set:function(data){
        var prev = store[path]; store[path] = JSON.parse(JSON.stringify(data));
        if (!persist()){ if (prev === undefined) delete store[path]; else store[path] = prev; return Promise.reject({code:"quota_exceeded"}); }
        fire(); return Promise.resolve();
      },
      update:function(data){
        if (store[path] === undefined) return Promise.reject({code:"not-found"});
        var next = JSON.parse(JSON.stringify(store[path])), k; for (k in data) next[k] = data[k];
        return this.set(next);
      },
      delete:function(){ delete store[path]; persist(); fire(); return Promise.resolve(); },
      onSnapshot:function(n){ var f = function(){ n(snap(path)); }; subs.push(f); setTimeout(f, 0); return function(){ var i = subs.indexOf(f); if (i !== -1) subs.splice(i, 1); }; } };
  }
  function col(path, q){
    q = q || {};
    function run(){
      var pre = path + "/", docs = Object.keys(store).filter(function(k){ return k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") === -1; }).sort().map(snap);
      if (q.w) docs = docs.filter(function(d){ var v = d.data()[q.w.f]; return q.w.op === "array-contains" ? Array.isArray(v) && v.indexOf(q.w.v) !== -1 : v === q.w.v; });
      if (q.o) docs.sort(function(a, b){ var x = a.data()[q.o.f], y = b.data()[q.o.f]; return (x < y ? -1 : x > y ? 1 : 0) * (q.o.d === "desc" ? -1 : 1); });
      if (q.n) docs = docs.slice(0, q.n);
      return {docs:docs, size:docs.length, empty:!docs.length};
    }
    return { path:path,
      where:function(f, op, v){ return col(path, {w:{f:f, op:op, v:v}, o:q.o, n:q.n}); },
      orderBy:function(f, d){ return col(path, {w:q.w, o:{f:f, d:d || "asc"}, n:q.n}); },
      limit:function(n){ return col(path, {w:q.w, o:q.o, n:n}); },
      get:function(){ return Promise.resolve(run()); },
      onSnapshot:function(n){ var f = function(){ n(run()); }; subs.push(f); setTimeout(f, 0); return function(){ var i = subs.indexOf(f); if (i !== -1) subs.splice(i, 1); }; },
      doc:function(id){ return doc(path + "/" + (id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      add:function(data){ var r = this.doc(); return r.set(data).then(function(){ return r; }); } };
  }
  return {doc:doc, collection:function(p){ return col(p); }};
}

/* Videos without file storage: the file is cut into pieces under 1MB and each piece is one small
   database record beside the posts (marked kind:"chunk", no "at", so the feed never lists it).
   Watching fetches the pieces and joins them again. Fine for short clips; not a streaming service. */
function chunkStore(){
  var SIZE = window.CHUNK_SIZE || 900 * 1024;
  function ref(id, i){ return db.doc("posts/" + id + "_c" + i); }
  return {
    put:function(file, type, onStep){
      var id = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), n = Math.max(1, Math.ceil(file.size / SIZE)), i = 0;
      function next(){
        if (i >= n) return Promise.resolve({id:id, n:n});
        return file.slice(i * SIZE, (i + 1) * SIZE).arrayBuffer().then(function(buf){
          return ref(id, i).set({uid:ME, kind:"chunk", of:id, i:i, b:firebase.firestore.Blob.fromUint8Array(new Uint8Array(buf))});
        }).then(function(){ i++; if (onStep) onStep(i, n); return next(); });
      }
      return next().catch(function(e){ for (var k = 0; k <= i && k < n; k++) ref(id, k).delete().catch(function(){}); throw e; });
    },
    get:function(id, n, type, onStep){
      var parts = new Array(n), done = 0, idx = 0;
      function worker(){
        if (idx >= n) return Promise.resolve();
        var k = idx++;
        return ref(id, k).get().then(function(sn){
          if (!sn.exists) throw {code:"missing"};
          parts[k] = sn.data().b.toUint8Array(); done++; if (onStep) onStep(done, n);
          return worker();
        });
      }
      if (!n) return Promise.reject({code:"missing"});
      return Promise.all([worker(), worker(), worker(), worker()]).then(function(){ return new Blob(parts, {type:type || "video/mp4"}); });
    },
    remove:function(id, n){ for (var k = 0; k < n; k++) ref(id, k).delete().catch(function(){}); }
  };
}
